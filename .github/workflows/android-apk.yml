name: Android APK (מגיע לך)

on:
  push:
    branches: [ccr-d452e790-ntiise]
    paths: ["veterans-hub/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: veterans-hub/android
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp veterans-hub/android/app/build/outputs/apk/debug/app-debug.apk magia-lecha.apk

      - uses: actions/upload-artifact@v4
        with:
          name: magia-lecha-apk
          path: magia-lecha.apk

      # קישור הורדה קבוע שאפשר לפתוח מהטלפון
      - name: Publish to the "apk-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: מגיע לך — גרסת בדיקה
          body: "APK לבדיקה בנייד. נבנה אוטומטית מהענף ccr-d452e790-ntiise (commit ${{ github.sha }})."
          prerelease: true
          files: magia-lecha.apk
