name: Build TV Remote APK

on:
  push:
    paths:
      - "samsung-remote/**"
      - ".github/workflows/samsung-remote.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samsung-remote
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Protocol tests (fake Samsung / LG / Android TV)
        run: gradle -p jvm-tests test --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: UI tests (touch taps through every button and panel)
        working-directory: samsung-remote/ui-tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node qa.js

      - name: Upload key for Google Play (from repository secrets, if set)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No upload key secret: the Google Play bundle will be unsigned."
          fi

      - name: Build family APK and Google Play bundle
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: gradle assembleFamilyRelease bundlePlayRelease --no-daemon --stacktrace

      - name: Collect outputs
        run: |
          cp app/build/outputs/apk/family/release/app-family-release.apk TV-Remote.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab TV-Remote-play.aab

      - uses: actions/upload-artifact@v4
        with:
          name: TV-Remote
          path: samsung-remote/TV-Remote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-play-bundle
          path: samsung-remote/TV-Remote-play.aab

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-remote-v${{ github.run_number }}
          name: שלט לטלוויזיה – גרסה ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: samsung-remote/TV-Remote.apk
          body: |
            שלט אוניברסלי לטלוויזיות חכמות: Samsung, LG ו-Android TV / Google TV.
            להורדה: לחצו על **TV-Remote.apk** למטה והתקינו בטלפון אנדרואיד.
