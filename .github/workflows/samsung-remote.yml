name: Build TV Remote APK

on:
  push:
    paths:
      - "samsung-remote/**"
      - ".github/workflows/samsung-remote.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samsung-remote
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TV-Remote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TV-Remote
          path: samsung-remote/TV-Remote.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-remote-v${{ github.run_number }}
          name: שלט לטלוויזיה – גרסה ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: samsung-remote/TV-Remote.apk
          body: |
            אפליקציית שלט לטלוויזיית סמסונג (Tizen, 2016 ומעלה).
            להורדה: לחצו על **TV-Remote.apk** למטה והתקינו בטלפון אנדרואיד.
