plugins {
    id "com.android.application"
}

android {
    namespace "il.magialecha.app"
    compileSdk 34

    defaultConfig {
        applicationId "il.magialecha.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        debug { applicationIdSuffix ".test" }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// קבצי האתר נכנסים לאפליקציה כ-assets, כך שהיא עובדת גם בלי שרת
tasks.register("copyWeb", Copy) {
    def web = rootProject.file("..")
    from(web) {
        include "index.html", "app.js", "styles.css", "store.js", "firebase-config.js", "data/**"
    }
    into layout.projectDirectory.dir("src/main/assets/www")
}
preBuild.dependsOn("copyWeb")
