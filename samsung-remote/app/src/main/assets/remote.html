<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TV Remote</title>
<style>
  :root {
    --bg: #0e1116;
    --surface: #161a21;
    --surface-2: #1e242e;
    --surface-3: #262d39;
    --line: #2a313d;
    --icon: #d5dbe3;
    --muted: #8b95a5;
    --accent: #2ec4a6;
    --accent-ink: #062720;
    --red: #ff5a5f;
    --key: min(17.5vw, 74px);
    --gap: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--icon);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    user-select: none; -webkit-user-select: none; overflow: hidden; overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; touch-action: manipulation; }
  svg { display: block; }

  .app {
    height: 100%; max-width: 460px; margin: 0 auto;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 10px 16px 14px; gap: 10px;
  }

  /* The remote keeps one physical layout in every language, like a real remote (power top-left,
     volume left, channels right); only text runs right-to-left. Banners with sentences follow the language. */
  .app { direction: ltr; }
  [dir=rtl] .app .trialbar, [dir=rtl] .app .recbar { direction: rtl; }

  /* header: power · TV chip · settings */
  .top { display: flex; align-items: center; gap: 10px; min-height: 48px; }
  .pwr {
    width: 48px; height: 48px; border-radius: 16px; flex: none; display: grid; place-items: center;
    background: #ff5a5f1f; color: var(--red); transition: transform .08s, background .08s;
  }
  .status {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0;
    height: 44px; padding: 0 14px; border-radius: 22px; background: var(--surface);
    font-size: 15px; color: var(--icon);
  }
  .status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .status.ok .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .status.wait .dot { background: #f5b942; animation: pulse 1s infinite alternate; }
  .status.err .dot { background: var(--red); }
  .status .chev { color: var(--muted); flex: none; }
  @keyframes pulse { from { opacity: .35 } to { opacity: 1 } }
  .gear { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; color: var(--muted); flex: none; }

  /* keys */
  .key {
    border-radius: 20px; background: var(--surface); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px; transition: background .08s, transform .08s;
  }
  .key small { font-size: 11px; color: var(--muted); line-height: 1; }
  .pressed { background: var(--surface-3) !important; transform: scale(.96); }

  .panel {
    display: grid; grid-template-columns: var(--key) 1fr 1fr var(--key);
    grid-template-rows: var(--key) var(--key); gap: var(--gap);
  }
  .panel .key { width: 100%; height: 100%; }
  .bar {
    grid-row: 1 / 3; border-radius: 20px; background: var(--surface);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .bar button { flex: 1; display: grid; place-items: center; transition: background .08s; }
  .bar .mid { flex: none; padding: 2px 0; text-align: center; font-size: 11px; color: var(--muted); pointer-events: none; }
  .vol { grid-column: 1; }
  .ch { grid-column: 4; }

  .row3 { display: grid; grid-template-columns: var(--key) 1fr var(--key); gap: var(--gap); align-items: center; }
  .row3 .key { height: 56px; }
  .seg {
    justify-self: center; display: flex; background: var(--surface); border-radius: 16px; padding: 4px; gap: 4px;
  }
  .seg button { height: 44px; padding: 0 14px; border-radius: 12px; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .seg button.on { background: var(--surface-3); color: var(--icon); }

  /* d-pad / touchpad */
  .padwrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; container-type: size; }
  .dpad {
    position: relative; width: min(78vw, 44vh, 340px); aspect-ratio: 1; flex: none;
    border-radius: 50%; background: var(--surface);
    box-shadow: inset 0 0 0 1px #ffffff08;
  }
  .dpad .arr { position: absolute; display: grid; place-items: center; border-radius: 30%; color: var(--icon); }
  .dpad .up    { top: 3%;  left: 30%; width: 40%; height: 26%; }
  .dpad .down  { bottom: 3%; left: 30%; width: 40%; height: 26%; }
  .dpad .left  { left: 3%;  top: 30%; width: 26%; height: 40%; }
  .dpad .right { right: 3%; top: 30%; width: 26%; height: 40%; }
  .dpad .ok {
    position: absolute; left: 32%; top: 32%; width: 36%; height: 36%; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); font-size: clamp(20px, 6vw, 28px); font-weight: 700; letter-spacing: 1px;
    box-shadow: 0 0 0 8px var(--surface-2);
  }
  .dpad .ok.pressed { background: #27a88f !important; }
  .touchpad {
    width: min(86vw, 380px); height: min(86vw, 44vh, 380px); border-radius: 28px;
    background: var(--surface); position: relative;
    display: none; touch-action: none; overflow: hidden;
  }
  .touchpad .hint { position: absolute; inset: auto 0 14px; text-align: center; color: var(--muted); font-size: 13px; pointer-events: none; }
  .touchpad .ripple {
    position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
    background: #2ec4a655; pointer-events: none; animation: rip .35s ease-out forwards;
  }
  @keyframes rip { from { transform: scale(.3); opacity: 1 } to { transform: scale(1.6); opacity: 0 } }
  @supports (width: 1cqh) {
    .dpad { width: min(78vw, 100cqh, 340px); }
    .touchpad { height: min(86vw, 100cqh, 380px); }
  }
  body.tp .dpad { display: none; }
  body.tp .touchpad { display: block; }

  .media { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); direction: ltr; } /* transport keys follow the timeline, never mirrored */
  .media button { height: 48px; display: grid; place-items: center; border-radius: 14px; background: var(--surface); }

  .apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
  .apps button {
    height: 56px; border-radius: 16px; background: var(--surface-2); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 5px; font-size: 13px; font-weight: 600; color: #e8edf3;
    overflow: hidden; padding: 0 4px;
  }
  .apps button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .apps button i { width: 22px; height: 3px; border-radius: 2px; display: block; }

  /* sheets */
  .scrim { position: fixed; inset: 0; background: #0009; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 520px; margin: 0 auto;
    background: var(--surface); border-radius: 24px 24px 0 0; padding: 10px 18px 22px;
    transform: translateY(105%); transition: transform .22s ease; max-height: 86vh; overflow-y: auto;
  }
  .sheet.show { transform: none; }
  .sheet .handle { width: 42px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
  .sheet h2 { font-size: 18px; margin: 4px 0 14px; font-weight: 600; color: #e8edf3; }
  .sheet h3 { font-size: 14px; color: var(--muted); margin: 18px 0 8px; font-weight: 500; }

  .numgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; direction: ltr; }
  .numgrid button { height: 60px; border-radius: 16px; background: var(--surface-2); font-size: 24px; color: #e8edf3; }
  .numgrid button.small { font-size: 14px; color: var(--icon); }
  .colors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 14px; direction: ltr; }
  .colors button { height: 46px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; }
  .colors i { width: 26px; height: 10px; border-radius: 5px; display: block; }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tiles button {
    background: var(--surface-2); border-radius: 16px; padding: 14px 6px; font-size: 13px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; color: #dfe5ec;
  }
  .tiles button b { font-size: 15px; font-weight: 700; letter-spacing: .5px; color: var(--icon); height: 24px; display: grid; place-items: center; }

  .applist { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 10px; }
  .applist button { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #dfe5ec; min-width: 0; }
  .applist .ic { width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; font-size: 22px; font-weight: 700; color: #fff; }
  .applist span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 20px 0; line-height: 1.6; }

  .card { background: var(--surface-2); border-radius: 16px; padding: 14px; }
  .tvrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; padding: 12px; border-radius: 14px; background: var(--surface-2); margin-bottom: 8px; }
  .tvrow .meta { flex: 1; min-width: 0; }
  .tvrow .meta div { font-size: 15px; color: #e8edf3; }
  .tvrow .meta small { color: var(--muted); font-size: 12px; direction: ltr; display: inline-block; }
  .tvrow.cur { box-shadow: inset 0 0 0 2px var(--accent); }
  .badge { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 1px 6px; margin-inline-start: 4px; vertical-align: middle; direction: ltr; }
  .btn { background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 12px 16px; font-size: 15px; font-weight: 700; }
  .btn.ghost { background: var(--surface-2); color: var(--icon); font-weight: 500; }
  .btn.full { width: 100%; }
  .inrow { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    color: #e8edf3; padding: 12px; font-size: 16px; outline: none; direction: ltr; text-align: left;
    user-select: text; -webkit-user-select: text;
  }
  input[type=text]:focus { border-color: var(--accent); }
  input.pin { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 26px; letter-spacing: 8px; text-align: center; text-transform: uppercase; }
  .sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .sw:last-child { border-bottom: 0; }
  .sw input { appearance: none; -webkit-appearance: none; width: 46px; height: 26px; border-radius: 13px; background: var(--line); position: relative; flex: none; transition: background .15s; }
  .sw input::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: inset-inline-start .15s; }
  .sw input:checked { background: var(--accent); }
  .sw input:checked::after { inset-inline-start: 23px; }
  .note { color: var(--muted); font-size: 13px; line-height: 1.6; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg) } }

  .toast {
    position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%) translateY(20px);
    background: #2a3240; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 14px;
    opacity: 0; transition: all .2s; pointer-events: none; z-index: 20;
    width: max-content; max-width: calc(100vw - 32px); text-align: center; line-height: 1.4;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  .recbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: none; align-items: center; gap: 8px;
    padding: 10px 14px; background: #3a1d22; color: #fff; font-size: 14px;
  }
  .recbar.show { display: flex; }
  .recbar span:nth-child(2) { flex: 1; }
  .recbar .btn { padding: 8px 12px; font-size: 14px; }
  .recdot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); animation: pulse .8s infinite alternate; }
  .seg.mini { padding: 3px; gap: 2px; border-radius: 12px; background: var(--bg); flex: none; }
  .seg.mini button { height: 32px; padding: 0 10px; font-size: 13px; border-radius: 9px; }
  .sw input:disabled { opacity: .35; }
  .tvrow .edit { display: flex; gap: 6px; margin-top: 8px; }
  .tvrow .icon-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); background: var(--surface-3); flex: none; }

  input.natural { direction: inherit; text-align: start; }

  /* language switch */
  .langbox { background: var(--surface-2); border-radius: 16px; padding: 12px 14px 14px; margin: 2px 0 14px; }
  .langhead { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: #e8edf3; margin-bottom: 10px; }
  .langhead svg { color: var(--accent); flex: none; }
  .langhead .alt { color: var(--muted); font-weight: 400; }
  .langhead .alt::before { content: "·"; margin-inline-end: 8px; }
  .langseg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--bg); border-radius: 14px; padding: 4px; }
  .langseg button { height: 46px; border-radius: 11px; font-size: 16px; font-weight: 600; color: var(--muted); }
  .langseg button.on { background: var(--accent); color: var(--accent-ink); }

  /* trial banner + license line */
  .trialbar {
    display: none; align-items: center; gap: 4px; flex: none;
    background: #2ec4a614; border: 1px solid #2ec4a650; border-radius: 14px; padding-inline-start: 12px;
  }
  .trialbar.show { display: flex; }
  .trialbar .tb-main { flex: 1; min-width: 0; text-align: start; font-size: 13px; line-height: 1.3; padding: 7px 0; color: var(--icon); }
  .trialbar .tb-main b { color: var(--accent); font-weight: 600; }
  .trialbar .tb-x { width: 36px; height: 36px; flex: none; display: grid; place-items: center; color: var(--muted); font-size: 14px; }
  .licrow { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .licrow .lic-txt { flex: 1; min-width: 0; font-size: 15px; color: #e8edf3; line-height: 1.4; }
  .licrow .lic-txt .note { display: block; }
  .licrow .lic-full { color: var(--accent); font-weight: 600; font-size: 15px; }

  /* Pro panel (dismissible) and PRO badges, shown only in the free version */
  .sheet.paywall { z-index: 12; max-height: 94vh; padding-top: 50px; }
  .pw-close { position: absolute; top: 6px; inset-inline-end: 10px; width: 40px; height: 40px; display: grid; place-items: center; color: var(--muted); font-size: 18px; }
  .pro-tag { display: none; font-size: 10px; font-weight: 800; letter-spacing: .5px; color: var(--accent-ink); background: var(--accent); border-radius: 6px; padding: 1px 5px; margin-inline-start: 6px; vertical-align: middle; }
  body.free .pro-tag { display: inline-block; }
  /* connection help under the header */
  .connhint { display: none; align-items: center; gap: 10px; background: #2a1f12; border: 1px solid #5a4220; color: #f3d9a8; border-radius: 14px; padding: 9px 12px; font-size: 13px; line-height: 1.35; }
  .connhint.show { display: flex; }
  .connhint span { flex: 1; min-width: 0; }
  .connhint button { color: var(--accent); font-weight: 700; font-size: 13px; padding: 4px 6px; flex: none; }
  [dir=rtl] .app .connhint { direction: rtl; }
  .scanhelp { background: var(--surface); border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.5; color: #e8edf3; margin-top: 8px; }
  .pw-hero { width: 52px; height: 52px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin: 14px auto 8px; }
  .paywall h2 { text-align: center; margin-bottom: 6px; }
  .paywall .lead { text-align: center; margin: 0 0 12px; }
  .benefits { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 8px; }
  .benefits li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: #e8edf3; line-height: 1.35; }
  .benefits li::before { content: "✓"; color: var(--accent); font-weight: 700; flex: none; width: 16px; text-align: center; }
  .btn.big { font-size: 17px; padding: 15px 16px; border-radius: 14px; }
  .linkbtn { display: block; margin: 8px auto 2px; color: var(--accent); font-size: 15px; padding: 10px 14px; text-decoration: underline; }
  .paywall .fine { text-align: center; font-size: 12px; margin: 4px 0 0; }

  /* simple mode: fewer, bigger buttons */
  body.simple { --key: min(21vw, 90px); }
  body.simple [data-key="KEY_MENU"], body.simple [data-sheet="numpad"], body.simple [data-sheet="more"],
  body.simple .seg, body.simple .media { display: none !important; }
  body.simple [data-key="KEY_MUTE"] { grid-column: 2 / 4; grid-row: 1 / 3; }
  body.simple .row3 [data-key="KEY_HOME"] { grid-column: 3; }
  body.simple .row3 .key { height: 64px; }
  body.simple .key small, body.simple .bar .mid { font-size: 15px; display: block; }
  body.simple .apps button { height: 64px; font-size: 15px; }
  body.simple .dpad .ok { font-size: 32px; }

  @media (max-height: 700px) {
    :root { --key: min(15vw, 58px); --gap: 9px; }
    .key small { display: none; }
    .row3 .key { height: 48px; }
    .media button { height: 40px; }
    .apps button { height: 46px; }
    .app { gap: 7px; }
    .pw-hero { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="pwr" data-action="power" data-i18n-aria="a_power">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.6a8 8 0 1 0 11.4 0"/></svg>
    </button>
    <button class="status wait" id="status" onclick="statusTap()">
      <i class="dot"></i><span id="statusText"></span>
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="gear" data-action="voice" data-i18n-aria="a_voice">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button class="gear" id="settingsBtn" onclick="openSheet('settings')" data-i18n-aria="a_settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <div class="trialbar" id="trialBar">
    <button class="tb-main" onclick="buy()"><span id="trialText"></span></button>
    <button class="tb-x" onclick="dismissTrial()" data-i18n-aria="dismiss">✕</button>
  </div>
  <div class="connhint" id="connHint"><span id="connHintText"></span><button id="connHintBtn" onclick="openHelp()" data-i18n="help_btn"></button></div>

  <div class="panel">
    <div class="bar vol">
      <button data-key="KEY_VOLUP" data-repeat data-i18n-aria="a_volup">
        <svg width="28" height="28" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="mid" data-i18n="vol"></div>
      <button data-key="KEY_VOLDOWN" data-repeat data-i18n-aria="a_voldown">
        <svg width="28" height="28" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
    </div>

    <button class="key" data-key="KEY_MUTE" data-i18n-aria="mute">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9.5h3.5L11 5.5v13l-4.5-4H3z" fill="currentColor" stroke="none"/><path d="M15 9.5l5 5M20 9.5l-5 5"/></svg>
      <small data-i18n="mute"></small>
    </button>

  const LANGS = ['en', 'he'];
  let LANG = 'en';
  // Translate a key, filling {name} placeholders from vars. Falls back to English, then to the key itself.
  function t(key, vars) {
    let s = I18N[LANG][key];
    if (s == null) s = I18N.en[key];
    if (s == null) return key;
    return vars ? s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? String(vars[k]) : m)) : s;
  }
  function detectLang() {
    const saved = String(A.getPref('lang', '') || '');
    if (LANGS.includes(saved)) return saved;
    const nl = String(navigator.language || '').toLowerCase();
    return nl.startsWith('he') || nl.startsWith('iw') ? 'he' : 'en';
  }

  function applyLang() {

    ['spotify', ['ספוטיפיי', 'ספוטיפי', 'spotify']],
  ];
  // Hebrew ways of saying app names the TV reports in English.
  const VOICE_ALIASES = {
    sting: ['סטינג'], yes: ['יס', 'yes'], stremio: ['סטרמיו', 'סטרימיו', 'סטרים יו'], smartthings: ['סמארטתינגס', 'סמארט תינגס'],
    gallery: ['גלריה'], nintendo: ['נינטנדו'], hbo: ['אייץ בי או'], 'kan box': ['כאן בוקס'], 'next': ['נקסט'], 'freetv': ['פריטיוי'],
    disney: ['דיסני'], prime: ['פריים', 'אמזון'], 'apple tv': ['אפל'], max: ['מקס'], twitch: ['טוויץ'],
    plex: ['פלקס'], kids: ['קידס', 'ילדים'], tubi: ['טובי'], pluto: ['פלוטו'], kan: ['כאן'], yes: ['יס'],
    partner: ['פרטנר'], cellcom: ['סלקום'], hot: ['הוט'], 'tv plus': ['טי וי פלוס'], internet: ['אינטרנט', 'דפדפן'],
  };
  let voiceQuery = '';
  // Whole-word match, allowing one Hebrew prefix letter ("ליוטיוב", "בנטפליקס").
  function hasWord(text, word) {
    const w = word.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return new RegExp('(^|[\\s,.!?])[והבלמשכ]?' + w + '($|[\\s,.!?])').test(text);
  }
  // Does the spoken text name this app/shortcut? Direct match, or a Hebrew alias of its English name.
  function voiceMatches(text, name) {
    const n = String(name || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
    if (n.length >= 2 && text.length >= 2 && (hasWord(text, n) || hasWord(n, text))) return true;
    return Object.entries(VOICE_ALIASES).some(([en, he]) => hasWord(n, en) && he.some((w) => hasWord(text, w)));
  }
  function onVoice(raw) {
    const text = String(raw || '').trim();
    if (!text || needPro()) return;
    const q = text.toLowerCase().replace(/^(תפתח|פתח|תפעיל|הפעל|תעבור ל|open|launch|start)\s+(את\s+)?/, '').trim();
    const macro = slots().find((sl) => sl && sl.macro && voiceMatches(q, sl.name));
    if (macro) { playMacro(macro.macro, macro.name); return; }
    for (const [key, words] of VOICE_KNOWN) {
      if (words.some((w) => hasWord(q, w))) { launchKnown(key); toast(t('opening', { name: KNOWN_APPS[key].label })); return; }
    }
    const hit = appList().find((a) => voiceMatches(q, a.name));
    if (hit) { launch(String(hit.appId), Number(hit.app_type) || 2); toast(t('opening', { name: hit.name })); return; }
    voiceQuery = text;
    $('voiceText').textContent = text;
    $('voiceYt').style.display = ytSearchOk() ? '' : 'none';
    openSheet('voice');
  }
  function voiceType() { if (needPro()) return; A.text(voiceQuery); toast(t('sent_tv')); closeSheets(); }
  function ytSearchOk() { return S.tvType === 'androidtv'; }
  function kbYoutube() {
    const q = $('kbText').value.trim();
    if (!q) { toast(t('kb_need')); return; }
    voiceQuery = q;
    $('kbText').value = '';
    voiceYoutube();
  }
  window.kbYoutube = kbYoutube;
  function voiceYoutube() {
    if (needPro()) return;
    launch('https://www.youtube.com/results?search_query=' + encodeURIComponent(voiceQuery), 0);
    toast(t('yt_searching'));
    closeSheets();
  }

  /* ---------- sleep timer ---------- */
  function setSleep(minutes) {
    if (minutes > 0 && needPro()) return;
    A.sleepTimer(minutes);
    toast(minutes ? t('sleep_set', { n: minutes }) : t('sleep_off'));
    closeSheets();
  }
  function setSleepCustom() {
    const n = parseInt(($('sleepCustom').value || '').replace(/[^0-9]/g, ''), 10);
    if (!n || n < 1 || n > 600) { toast(t('sleep_bad')); return; }
    $('sleepCustom').value = '';
    setSleep(n);
  }
  window.setSleepCustom = setSleepCustom;
  function sleepLeft() { return S.sleepAt ? Math.max(1, Math.round((S.sleepAt - Date.now()) / 60000)) : 0; }
  function renderSleep() {
    const left = sleepLeft();
    $('sleepState').textContent = left ? t('sleep_left', { n: left }) : t('sleep_auto');
    $('sleepCancel').style.display = left ? '' : 'none';
  }
  function renderSleepTile() {
    const left = sleepLeft();
    $('sleepTile').textContent = left ? t('sleep_tile', { n: left }) : t('sleep_timer');
  }
  setInterval(renderSleepTile, 30000);

  /* ---------- TV switcher ---------- */
  function renderTvs() {
    const list = $('tvList');
    if (!S.tvs.length) { list.innerHTML = '<div class="empty">' + esc(t('tvs_empty')) + '</div>'; return; }
    list.innerHTML = S.tvs.map((tv) => {
      const cur = tv.ip === S.ip;
      const title = tv.label || tv.name || 'TV';
      return '<div class="tvrow' + (cur ? ' cur' : '') + '" data-tv="' + esc(tv.ip) + '">' +
        '<div class="meta" data-switch="1"><div><span dir="auto">' + esc(title) + '</span> <span class="badge">' + esc(BRANDS[tv.type] || '') + '</span></div>' +
        '<small>' + esc(tv.label ? tv.name + ' · ' + tv.ip : tv.ip) + '</small>' +
        (cur ? '<div class="note">' + esc(S.state === 'connected' ? t('connected_now') : $('statusText').textContent) + '</div>' : '') + '</div>' +
        '<button class="icon-btn" data-rename="1" aria-label="' + esc(t('rename')) + '">✎</button>' +
        '<button class="icon-btn" data-remove="1" aria-label="' + esc(t('remove')) + '">✕</button></div>';
    }).join('');
  }
  $('tvList').addEventListener('click', (e) => {
    const row = e.target.closest('[data-tv]');
    if (!row) return;
    const ip = row.dataset.tv;
    const tvInfo = S.tvs.find((x) => x.ip === ip) || {};
    if (e.target.closest('[data-remove]')) {
      if (row.dataset.confirm) { A.removeTv(ip); toast(t('removed')); return; }
      row.dataset.confirm = '1';
      e.target.closest('[data-remove]').textContent = t('remove_q');
      e.target.closest('[data-remove]').style.width = 'auto';
      e.target.closest('[data-remove]').style.padding = '0 10px';
      return;
    }
    if (e.target.closest('[data-rename]')) {
      const meta = row.querySelector('.meta');
      meta.removeAttribute('data-switch');
      meta.innerHTML = '<div class="inrow"><input type="text" class="renameInput natural" placeholder="' + esc(t('rename_ph')) + '" value="' +
        esc(tvInfo.label || '') + '"><button class="btn" data-save="1">' + esc(t('save')) + '</button></div>';
      const input = meta.querySelector('input');
      input.focus();
      const save = () => { A.renameTv(ip, input.value); toast(t('saved')); };
      meta.querySelector('[data-save]').onclick = (ev) => { ev.stopPropagation(); save(); };
      input.onkeydown = (ev) => { if (ev.key === 'Enter') save(); };
      return;
    }
    if (e.target.closest('[data-switch]') && ip !== S.ip) {
      if (needPro()) return; // several TVs: Pro
      buzz();
      A.switchTv(ip);
      S.apps = [];
      toast(t('switching_to', { name: tvInfo.label || tvInfo.name }));
      closeSheets();
    }
  });

  /* ---------- Android TV pairing code ---------- */
  function submitPin() {
    const v = $('pinInput').value.trim().toUpperCase();
    if (!/^[0-9A-F]{6}$/.test(v)) { toast(t('pin_bad')); return; }
    A.submitPin(v);
    toast(t('pin_checking'));
    closeSheets();
  }
  $('pinInput').addEventListener('input', (e) => { e.target.value = e.target.value.toUpperCase().replace(/[^0-9A-F]/g, ''); });
  $('pinInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitPin(); } });

  /* ---------- status & settings ---------- */
  const STATUS = {
    idle: '', connecting: 'wait', reconnecting: 'wait', pairing: 'wait', pin: 'wait',
    connected: 'ok', denied: 'err', noTv: 'err', badIp: 'err',
  };
  // Help line under the header: pairing instructions, or "can't reach the TV" after ~12 s without a connection.
  let troubleSince = 0;
  const CONN_HINT_MS = 12000;
  function renderConnHint() {
    const bad = S.ip && (S.state === 'connecting' || S.state === 'reconnecting');
    if (!bad) troubleSince = 0; else if (!troubleSince) troubleSince = Date.now();
    let text = '';
    if (S.state === 'pairing' && (S.tvType === 'samsung' || S.tvType === 'lg')) text = t('pair_hint');
    else if (bad && Date.now() - troubleSince >= (window.__connHintMs || CONN_HINT_MS)) text = t('conn_hint');
    $('connHintText').textContent = text;
    $('connHintBtn').style.display = S.state === 'pairing' ? 'none' : '';
    $('connHint').classList.toggle('show', !!text);
  }
  setInterval(renderConnHint, 1000);
  function openHelp() {
    openSheet('settings');
    setTimeout(() => { const h = $('helpText'); if (h) h.scrollIntoView({ block: 'center' }); }, 350);
  }
  window.openHelp = openHelp;
  function renderStatus() {
    renderConnHint();
    const known = S.state in STATUS;
    const text = !known ? String(S.state) : S.state === 'connected' ? null : t('st_' + S.state);
    $('status').className = 'status ' + (STATUS[S.state] || '');
    $('statusText').textContent = text || (S.label || String(S.name || '').replace(/^\[TV\]\s*/, '') || S.ip);
    if (text) $('statusText').removeAttribute('dir'); else $('statusText').dir = 'auto';
  }
  function renderSettings() {
    const has = !!S.ip;
    $('curTv').innerHTML = has
      ? '<div style="font-size:15px;color:#e6ebf1"><span dir="auto">' + esc(S.name || 'TV') + '</span> <span class="badge">' + esc(BRANDS[S.tvType] || '') + '</span></div>' +
        '<div class="note"><span dir="ltr">' + esc(S.ip) + (S.mac ? ' · ' + esc(S.mac) : '') + '</span></div>' +
        '<div class="note" style="margin-top:4px">' + esc(($('statusText').textContent)) + '</div>'
      : '<div class="note">' + esc(t('no_tv_yet')) + '</div>';
    $('ipInput').value = $('ipInput').value || S.ip;
    $('prefHwVolume').checked = pref.hwVolume;
    $('prefHaptic').checked = pref.haptic;
    $('prefSimple').checked = pref.simple;
    renderQuick();
    renderLicense();
    const brands = ['samsung', 'lg', 'androidtv'];
    $('helpText').innerHTML = (S.tvType && brands.includes(S.tvType) ? t('help_' + S.tvType) : brands.map((k) => t('help_' + k).split('<br>')[0]).join('<br>')) +
      '<br>' + t('help_wifi');
    renderScan();
  }
  function renderScan() {
    const list = $('scanList');
    list.innerHTML = S.found.map((d) =>
      '<button class="tvrow' + (d.ip === S.ip ? ' cur' : '') + '" data-ip="' + esc(d.ip) + '">' +
      '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2ec4a6" stroke-width="1.8"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/></svg>' +
      '<div class="meta"><div><span dir="auto">' + esc(d.name) + '</span> <span class="badge">' + esc(BRANDS[d.type] || '') + '</span></div><small>' + esc(d.ip) + (d.model ? ' · ' + esc(d.model) : '') + '</small></div>' +
      (d.ip === S.ip ? '<span class="note">' + esc(t('selected')) + '</span>' : '') + '</button>').join('') +
      (S.scanning ? '<div class="empty"><span class="spinner"></span> ' + esc(t('scanning')) + '</div>' : '') +
      (!S.scanning && S.scanDone && !S.found.length ? '<div class="scanhelp" id="scanHelp">' + t('scan_help') + '</div>' : '');
    $('scanBtn').style.display = S.scanning ? 'none' : '';
  }
  $('scanList').addEventListener('click', (e) => {
    const b = e.target.closest('[data-ip]');
    if (!b) return;
    const d = S.found.find((x) => x.ip === b.dataset.ip);
    if (d) selectTv(d);
  });
  function selectTv(d) {
    // Free version: one TV (replacing it is fine); keeping a third one around is Pro.
    if (d.ip !== S.ip && S.tvs.length >= 2 && !S.tvs.some((x) => x.ip === d.ip) && needPro()) return;
    buzz();
    A.selectTv(d.ip, d.type || 'samsung', d.name || 'TV', d.mac || '');
    S.ip = d.ip; S.tvType = d.type || 'samsung'; S.name = d.name; S.mac = d.mac; S.apps = [];
    toast(t('connecting_to', { name: d.name }));
    setTimeout(() => { if (shown('settings')) closeSheets(); }, 400);
  }
  function startScan() {
    S.scanning = true; S.scanDone = false; S.found = [];
    renderScan();
    A.scan();
  }
  function connectIp() {
    const ip = $('ipInput').value.trim();
    if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) { toast(t('bad_ip')); return; }
    A.connectIp(ip);
    S.apps = [];
    toast(t('connecting_to', { name: ip }));
    closeSheets();
  }
  $('prefHwVolume').addEventListener('change', (e) => { if (e.target.checked && needPro()) { e.target.checked = false; return; } pref.hwVolume = e.target.checked; A.setPref('hwVolume', pref.hwVolume ? '1' : '0'); });
  $('prefHaptic').addEventListener('change', (e) => { pref.haptic = e.target.checked; A.setPref('haptic', pref.haptic ? '1' : '0'); });
  $('prefSimple').addEventListener('change', (e) => {
    pref.simple = e.target.checked;
    A.setPref('simple', pref.simple ? '1' : '0');
    document.body.classList.toggle('simple', pref.simple);
    if (pref.simple) setTouchpad(false);
  });
  function statusTap() {
    if (S.state === 'pin') { openSheet('pin'); return; }
    if (S.state === 'denied' || S.state === 'reconnecting') A.reconnect();
    openSheet(S.tvs.length ? 'tvs' : 'settings');
  }

  /* ---------- quick access (notification, lock-screen volume, calls) ---------- */
  let pendingCall = 'off';
  function renderQuick() {
    pref.quick = A.getPref('quickControls', '0') === '1'; // may be switched off from the notification
    $('prefQuick').checked = pref.quick;
    document.querySelectorAll('#callSeg [data-call]').forEach((b) => b.classList.toggle('on', b.dataset.call === pref.callAction));
  }
  $('prefQuick').addEventListener('change', (e) => {
    if (e.target.checked && needPro()) { e.target.checked = false; return; }
    if (e.target.checked) { A.requestPermission('notifications'); return; }
    pref.quick = false;
    A.setPref('quickControls', '0');
    A.applyQuickSettings();
    renderQuick();
  });
  $('callSeg').addEventListener('click', (e) => {
    const b = e.target.closest('[data-call]');
    if (!b) return;
    buzz();
    if (b.dataset.call === 'off') {
      pref.callAction = 'off';
      A.setPref('callAction', 'off');
      A.applyQuickSettings();
      renderQuick();
      return;
    }
    if (needPro()) return;
    pendingCall = b.dataset.call;
    A.requestPermission('phone');
  });
  function onPermission(m) {
    if (m.what === 'notifications') {
      pref.quick = true;
      A.setPref('quickControls', '1');
      if (!m.granted) toast(t('perm_notif'));
    } else if (m.what === 'phone') {
      if (m.granted) {
        pref.callAction = pendingCall;
        A.setPref('callAction', pendingCall);
        toast(pendingCall === 'pause' ? t('call_pause_on') : t('call_mute_on'));
      } else {
        toast(t('perm_phone'));
      }
    }
    A.applyQuickSettings();
    renderQuick();
  }

  /* ---------- messages from Android ---------- */
  let autoScanned = false;
  window.onTv = function (m) {
    switch (m.type) {
      case 'status': {
        const prevIp = S.ip;
        Object.assign(S, { state: m.state, ip: m.ip, tvType: m.tvType || '', name: m.name, label: m.label || '', mac: m.mac, tvs: m.tvs || [], sleepAt: m.sleepAt || 0 });
        if (prevIp !== m.ip) { S.apps = []; renderShortcuts(); }
        renderStatus();
        renderSleepTile();
        if (shown('tvs')) renderTvs();
        if (m.state === 'pin') openSheet('pin');
        else if (shown('pin')) closeSheets();
        if (shown('settings')) renderSettings();
        if (m.state === 'noTv' && !autoScanned) {
          autoScanned = true;
          openSheet('settings');
          startScan();
        }
        break;
      }
      case 'apps':
        S.apps = m.apps || [];
        appsAnswered = true;
        if (shown('apps')) renderApps();
        if (shown('pick')) renderPicker();
        break;
      case 'scanFound':
        S.found = S.found.filter((d) => d.ip !== m.device.ip).concat([m.device]);
        renderScan();
        break;
      case 'scanDone':
        S.scanning = false;
        S.scanDone = true;
        renderScan();
        if (!m.ok) toast(t('no_wifi'));
        else if (!m.count) toast(t('no_tv_found'));
        else if (m.count === 1 && !S.ip) selectTv(S.found[0]);
        break;
      case 'toast':
        toast(m.text); // native toasts arrive already localized
        break;
      case 'keyboard':
        if (!shown('keyboard') && !isFree()) {
          openSheet('keyboard');
          setTimeout(() => $('kbText').focus(), 250);
          toast(t('tv_wants_text'));
        }
        break;
      case 'permission':
        onPermission(m);
        break;
      case 'voice':
        onVoice(m.text);
        break;
      case 'license': {
        const was = LIC.state;
        LIC = normLicense(m);
        renderLicense();
        if (LIC.state === 'purchased' && was !== 'purchased' && was !== 'family') toast(t('lic_thanks'));
        break;
      }
    }
  };

  LANG = detectLang();
  LIC = readLicense();
  applyLang();
  document.body.classList.toggle('simple', pref.simple);
  setTouchpad(pref.touchpad && !pref.simple);
  renderShortcuts();
  $('ver').textContent = t('version', { v: A.version() || '' });
  renderStatus();
  renderSleepTile();
  renderLicense();
  A.status();
</script>
</body>
</html>
