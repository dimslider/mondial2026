var ORIG = JSON.stringify(S);
var dirty = false, readOnly = false, api = null;

var STATUS = [
  ["draft","טיוטה","var(--draft)"], ["sent","נשלח","var(--sent)"],
  ["replied","נענה","var(--replied)"], ["meeting","שיחה נקבעה","var(--meeting)"],
  ["won","נסגר ✓","var(--won)"], ["lost","נסגר ✗","var(--lost)"]
];
var BY = {done:["תוקן ✓","var(--won)"], you:["אתה","var(--lost)"], me:["אני — באישורך","var(--replied)"]};
var TRK = {"עסק":"var(--trk-biz)","ספר":"var(--trk-book)","קליני":"var(--trk-clin)","תשתית":"var(--trk-inf)"};
function stLabel(k){ for(var i=0;i<STATUS.length;i++) if(STATUS[i][0]===k) return STATUS[i]; return STATUS[0]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); }
function uid(){ return "x" + Math.random().toString(36).slice(2,9); }

document.getElementById("root").appendChild(
  document.getElementById("shell").content.cloneNode(true));

var pipeEl = document.getElementById("pipe"), agEl = document.getElementById("agents"),
    idEl = document.getElementById("ideas"), noteEl = document.getElementById("note"),
    bar = document.getElementById("bar"), barTxt = document.getElementById("barTxt"),
    saveBtn = document.getElementById("save");

function touch(){ dirty = JSON.stringify(S) !== ORIG; paintBar(); }
function paintBar(){
  bar.hidden = !dirty || readOnly;
  barTxt.textContent = "יש שינויים שלא נשמרו";
}

function render(){
  var counts = {};
  S.pipeline.forEach(function(p){ counts[p.status] = (counts[p.status]||0) + 1; });
  document.getElementById("funnel").innerHTML = STATUS.map(function(s){
    return '<div class="fc" style="--c:' + s[2] + '"><div class="v num">' +
      (counts[s[0]]||0) + '</div><div class="k">' + s[1] + '</div></div>';
  }).join("");
  document.getElementById("hint1").textContent =
    "המדד שקובע הוא נסגר ✓ — לא כמה נשלחו";

  var al = document.getElementById("alerts");
  al.innerHTML = S.alerts.length ? S.alerts.map(function(a){
    return '<div class="card" data-al="' + esc(a.id) + '" style="border-inline-start:3px solid var(--lost)">' +
      '<div class="row1"><span class="org">' + esc(a.t) + '</span>' +
      '<span class="by" data-k="' + esc(a.by) + '" style="--bc:' + BY[a.by][1] + '">' +
      BY[a.by][0] + '</span>' +
      '<span class="trk" style="--tc:var(--muted)">' + esc(a.c) + '</span>' +
      '<button class="fbtn" data-done>הסתר</button></div>' +
      '<div style="color:var(--ink-2);font-size:15.5px">' + esc(a.d) + '</div></div>';
  }).join("") : '<div class="card" style="color:var(--muted)">אין תקלות פתוחות.</div>';

  pipeEl.innerHTML = S.pipeline.map(function(p){
    var s = stLabel(p.status);
    return '<div class="card" data-p="' + esc(p.id) + '">' +
      '<div class="row1"><span class="org ed" contenteditable data-f="org">' + esc(p.org) + '</span>' +
      '<select data-f="status" style="--st:' + s[2] + '">' + STATUS.map(function(o){
        return '<option value="' + o[0] + '"' + (o[0]===p.status?" selected":"") + '>' + o[1] + '</option>';
      }).join("") + '</select>' +
      '<button class="x" data-del="p" title="מחק">✕</button></div>' +
      '<div class="meta"><span class="ed" contenteditable data-f="who" data-empty="מי הנמען">' + esc(p.who) + '</span>' +
      '<span class="ed num" contenteditable data-f="date" data-empty="תאריך שליחה">' + esc(p.date) + '</span></div>' +
      '<div class="ed" contenteditable data-f="note" data-empty="הערה">' + esc(p.note) + '</div></div>';
  }).join("");

  var nf = S.agents.filter(function(a){ return a.frozen; }).length;
  document.getElementById("hint2").textContent = nf
    ? nf + " מוקפאים · " + (S.agents.length - nf) + " פעילים"
    : S.agents.length + " סוכנים · אף אחד לא מוקפא";
  agEl.innerHTML = S.agents.map(function(a){
    return '<div class="card' + (a.frozen?" frozen":"") + '" data-a="' + esc(a.id) + '">' +
      '<div class="row1"><span class="org ed" contenteditable data-f="name">' + esc(a.name) + '</span>' +
      '<span class="trk" style="--tc:' + (TRK[a.track]||"var(--muted)") + '">' + esc(a.track) + '</span>' +
      '<button class="fbtn" data-frz aria-pressed="' + (a.frozen?"true":"false") + '">' +
      (a.frozen ? "מוקפא" : "הקפא") + '</button></div>' +
      '<div class="ed" contenteditable data-f="does">' + esc(a.does) + '</div></div>';
  }).join("");

  idEl.innerHTML = S.ideas.map(function(i){
    return '<div class="card" data-i="' + esc(i.id) + '"><div class="row1">' +
      '<span class="ed" style="flex:1" contenteditable data-f="text" data-empty="מה הסוכן יעשה">' +
      esc(i.text) + '</span><button class="x" data-del="i" title="מחק">✕</button></div></div>';
  }).join("");

  if (noteEl.value !== (S.note||"")) noteEl.value = S.note || "";
  document.getElementById("foot").innerHTML =
    '<span>עודכן ' + esc(S.updated) + '</span><span>הלוח נשמר לעצמו — אותו קישור, גרסה חדשה</span>';
  paintBar();
}

function find(list, key, el, attr){
  var host = el.closest("[data-" + attr + "]");
  if (!host) return null;
  var id = host.getAttribute("data-" + attr);
  for (var i=0;i<list.length;i++) if (list[i][key] === id) return list[i];
  return null;
}

document.addEventListener("input", function(e){
  var t = e.target;
  if (t === noteEl){ S.note = t.value; touch(); return; }
  if (!t.classList || !t.classList.contains("ed")) return;
  var f = t.getAttribute("data-f"), v = t.textContent.trim();
  var o = find(S.pipeline,"id",t,"p") || find(S.agents,"id",t,"a") || find(S.ideas,"id",t,"i");
  if (o){ o[f] = v; touch(); }
});

document.addEventListener("change", function(e){
  var t = e.target;
  if (t.tagName !== "SELECT") return;
  var o = find(S.pipeline,"id",t,"p");
  if (o){ o.status = t.value; touch(); render(); }
});

document.addEventListener("click", function(e){
  var t = e.target;
  if (t.hasAttribute && t.hasAttribute("data-frz")){
    var a = find(S.agents,"id",t,"a");
    if (a){ a.frozen = !a.frozen; touch(); render(); }
    return;
  }
  if (t.hasAttribute && t.hasAttribute("data-done")){
    var host = t.closest("[data-al]");
    if (host){ var aid = host.getAttribute("data-al");
      S.alerts = S.alerts.filter(function(x){ return x.id !== aid; });
      touch(); render(); }
    return;
  }
  if (t.hasAttribute && t.hasAttribute("data-del")){
    var k = t.getAttribute("data-del");
    if (k === "p"){ var p = find(S.pipeline,"id",t,"p");
      S.pipeline = S.pipeline.filter(function(x){ return x !== p; }); }
    else { var i = find(S.ideas,"id",t,"i");
      S.ideas = S.ideas.filter(function(x){ return x !== i; }); }
    touch(); render(); return;
  }
  if (t.id === "addP"){
    S.pipeline.push({id:uid(), org:"ארגון חדש", who:"", status:"draft", date:"", note:""});
    touch(); render();
    var c = pipeEl.lastElementChild; if (c) c.querySelector(".ed").focus();
    return;
  }
  if (t.id === "addI"){
    S.ideas.push({id:uid(), text:""});
    touch(); render();
    var d = idEl.lastElementChild; if (d) d.querySelector(".ed").focus();
    return;
  }
  if (t.id === "undo"){ S = JSON.parse(ORIG); dirty = false; render(); return; }
  if (t.id === "save"){ save(); return; }
});

function buildDoc(){
  var css  = document.getElementById("css").textContent;
  var shell= document.getElementById("shell").innerHTML;
  var app  = document.getElementById("app").textContent;
  var data = JSON.stringify(S, null, 1).replace(/</g, "\\u003c");
  var st = "scr" + "ipt";
  return '<!doctype html>\n<html dir="rtl" lang="he">\n<head>\n<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">\n' +
    '<title>לוח הבקרה</title>\n' +
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@300;400;600;700&display=swap">\n' +
    '<style id="css">' + css + '</style>\n</head>\n<body>\n' +
    '<template id="shell">' + shell + '</template>\n' +
    '<div id="root"></div>\n' +
    '<' + st + ' id="state" type="application/json">' + data + '</' + st + '>\n' +
    '<' + st + ' id="app">' + app + '</' + st + '>\n</body>\n</html>';
}

function goRO(msg){
  readOnly = true; bar.hidden = true;
  if (document.getElementById("roNote")) return;
  var d = document.createElement("div");
  d.className = "ro"; d.id = "roNote"; d.textContent = msg;
  noteEl.parentNode.appendChild(d);
}

function save(){
  if (!api){ goRO("שמירה לא זמינה בתצוגה הזו. השינויים נשארו על המסך בלבד."); return; }
  saveBtn.disabled = true; barTxt.textContent = "שומר…";
  api.publish(buildDoc()).then(function(){
    barTxt.textContent = "נשמר";
  })["catch"](function(err){
    var c = err && err.code;
    if (c === "conflict"){ barTxt.textContent = "מישהו שמר לפניך — הדף נטען מחדש"; return; }
    saveBtn.disabled = false;
    if (c === "not_writer" || c === "not_granted" || c === "not_declared" || c === "capability_disabled"){
      goRO("אין לך הרשאת כתיבה לדף הזה, ולכן השינויים לא נשמרו.");
    } else if (c === "rate_limited"){
      barTxt.textContent = "יותר מדי שמירות — נסה שוב בעוד רגע";
    } else if (c === "too_large"){
      barTxt.textContent = "הלוח גדול מדי לשמירה — מחק שורות ישנות";
    } else {
      barTxt.textContent = "השמירה נכשלה. נסה שוב.";
    }
  });
}

render();

if (window.claude && window.claude.use){
  window.claude.use("artifact").then(function(a){
    api = a;
    if (!a) goRO("שמירה לא זמינה בתצוגה הזו. אפשר לערוך, אבל השינויים לא יישמרו.");
  })["catch"](function(){ goRO("שמירה לא זמינה בתצוגה הזו."); });
} else {
  goRO("שמירה לא זמינה בתצוגה הזו.");
}

window.addEventListener("beforeunload", function(e){
  if (dirty && !readOnly){ e.preventDefault(); e.returnValue = ""; }
});
})();
</script>
