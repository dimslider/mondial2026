  :root{
    --ground:#f1f1f5; --surface:#fff; --sunk:#e9e9ef; --surface-2:#f8f8fb;
    --ink:#17171f; --ink-2:#4a4a5c; --mute:#74748c;
    --line:#e0e0e9; --line-2:#c9c9d6;
    --brass:#8a6a1f; --brass-soft:#b89a55; --brass-wash:#8a6a1f12;
    --ok:#2c7550; --info:#3a5d9e; --warn:#a8641b; --bad:#b0332b;
    --draft:#7d7d92; --sent:#3a5d9e; --replied:#a8641b; --meeting:#2c7550; --won:#1d6b45; --lost:#b0332b;
    --shadow:0 1px 2px #17171f0a, 0 4px 14px -8px #17171f24;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#101016; --surface:#1a1a22; --sunk:#15151c; --surface-2:#1f1f29;
    --ink:#ececf3; --ink-2:#b8b8c8; --mute:#8b8ba2;
    --line:#2a2a36; --line-2:#3c3c4b;
    --brass:#cfa64e; --brass-soft:#8a7440; --brass-wash:#cfa64e14;
    --ok:#4fae7c; --info:#7ba0dd; --warn:#d99548; --bad:#e0685e;
    --draft:#9a9ab0; --sent:#7ba0dd; --replied:#d99548; --meeting:#4fae7c; --won:#5cc48c; --lost:#e0685e;
    --shadow:0 1px 2px #00000050, 0 6px 20px -12px #00000090;
  }}
  :root[data-theme="dark"]{
    --ground:#101016; --surface:#1a1a22; --sunk:#15151c; --surface-2:#1f1f29;
    --ink:#ececf3; --ink-2:#b8b8c8; --mute:#8b8ba2;
    --line:#2a2a36; --line-2:#3c3c4b;
    --brass:#cfa64e; --brass-soft:#8a7440; --brass-wash:#cfa64e14;
    --ok:#4fae7c; --info:#7ba0dd; --warn:#d99548; --bad:#e0685e;
    --draft:#9a9ab0; --sent:#7ba0dd; --replied:#d99548; --meeting:#4fae7c; --won:#5cc48c; --lost:#e0685e;
    --shadow:0 1px 2px #00000050, 0 6px 20px -12px #00000090;
  }
  *{box-sizing:border-box}
  body{background:var(--ground); color:var(--ink); margin:0;
    font-family:"Assistant",system-ui,"Segoe UI",sans-serif; font-size:17px; line-height:1.6;
    -webkit-font-smoothing:antialiased; padding-bottom:104px}
  .wrap{max-width:1180px; margin:0 auto; padding:0 20px}
  h1,h2,h3{font-family:"Frank Ruhl Libre",Georgia,serif; margin:0; text-wrap:balance}
  .ltr{direction:ltr; unicode-bidi:isolate; display:inline-block}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- כותרת ---------- */
  header{border-top:3px solid var(--brass); padding:26px 0 20px}
  .top{display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap}
  .eyebrow{font-size:12px; font-weight:700; letter-spacing:.17em; color:var(--brass); margin-bottom:8px}
  header h1{font-size:clamp(30px,5vw,42px); font-weight:900; line-height:1.1}
  .kpis{display:flex; gap:26px; margin-inline-start:auto; flex-wrap:wrap}
  .kpi b{display:block; font-family:"Frank Ruhl Libre",serif; font-size:31px; font-weight:700;
    line-height:1; color:var(--k,var(--ink))}
  .kpi span{font-size:13.5px; color:var(--mute)}
  nav{display:flex; gap:7px; flex-wrap:wrap; margin-top:20px}
  nav a{font-size:14.5px; text-decoration:none; color:var(--ink-2); padding:6px 14px;
    border:1px solid var(--line); border-radius:99px; background:var(--surface)}
  nav a:hover{border-color:var(--brass); color:var(--brass)}
  nav a:focus-visible{outline:2px solid var(--brass); outline-offset:2px}

  /* ---------- אזור ---------- */
  .zone{margin-top:40px; scroll-margin-top:16px}
  .zhead{display:flex; align-items:baseline; gap:13px; flex-wrap:wrap;
    border-bottom:2px solid var(--line-2); padding-bottom:10px; margin-bottom:18px}
  .zhead h2{font-size:25px; font-weight:800}
  .zhead .sub{font-size:14.5px; color:var(--mute); margin-inline-start:auto; text-align:end}

  /* ---------- אזור פעולה ---------- */
  .acts{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:12px}
  .act{background:var(--surface); border:1px solid var(--brass-soft); border-radius:4px;
    border-top:3px solid var(--brass); padding:16px 18px; box-shadow:var(--shadow)}
  .act b{display:block; font-size:17.5px; margin-bottom:6px}
  .act p{margin:0; font-size:14.5px; color:var(--ink-2)}
  .act .tags{display:flex; gap:8px; margin-top:12px; font-size:13px; color:var(--mute)}
  .act .tags i{font-style:normal; color:var(--brass); font-weight:700}

  /* ---------- מסלול ---------- */
  .track{margin-top:24px}
  .thead{display:flex; align-items:baseline; gap:11px; margin-bottom:11px; flex-wrap:wrap}
  .thead h3{font-size:19px; font-weight:700; color:var(--tc)}
  .thead .cnt{font-size:13.5px; color:var(--mute); font-variant-numeric:tabular-nums}
  .thead .what{font-size:14px; color:var(--mute); margin-inline-start:auto}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px}

  /* ---------- כרטיס סוכן ---------- */
  .ag{background:var(--surface); border:1px solid var(--line); border-radius:4px;
    border-inline-start:3px solid var(--sc); padding:15px 17px; box-shadow:var(--shadow);
    display:flex; flex-direction:column}
  .ag.off{opacity:.45}
  .agh{display:flex; align-items:center; gap:9px; margin-bottom:3px}
  .agh .nm{font-weight:700; font-size:18px; flex:1; min-width:0}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--sc); flex:none}
  .st{font-size:12.5px; font-weight:600; color:var(--sc); white-space:nowrap}
  .does{font-size:15px; color:var(--ink-2); margin:4px 0 12px}
  dl{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; margin:0; font-size:14px;
    padding-top:11px; border-top:1px dashed var(--line)}
  dt{color:var(--mute); font-size:12.5px; font-weight:700; letter-spacing:.04em; white-space:nowrap; padding-top:2px}
  dd{margin:0; color:var(--ink-2)}
  dd.file{font-family:ui-monospace,Menlo,monospace; font-size:12.5px; direction:ltr; text-align:start}
  .agf{display:flex; align-items:center; gap:9px; margin-top:12px; padding-top:11px;
    border-top:1px dashed var(--line); flex-wrap:wrap}
  .call{font-size:13.5px; color:var(--brass); background:var(--brass-wash);
    border:1px solid var(--brass-soft); border-radius:3px; padding:2px 10px}
  .score{font-size:13px; color:var(--mute); font-variant-numeric:tabular-nums}
  .fbtn{font:inherit; font-size:13px; cursor:pointer; padding:3px 11px; border-radius:3px;
    margin-inline-start:auto; border:1px solid var(--line-2); background:var(--surface); color:var(--mute)}
  .fbtn[aria-pressed="true"]{background:var(--mute); border-color:var(--mute); color:var(--surface)}
  .fbtn:focus-visible{outline:2px solid var(--brass); outline-offset:1px}

  /* ---------- צנרת ---------- */
  .funnel{display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:8px; margin-bottom:16px}
  .fc{background:var(--surface); border:1px solid var(--line); border-radius:4px;
    border-top:3px solid var(--c); padding:13px 14px}
  .fc b{display:block; font-family:"Frank Ruhl Libre",serif; font-size:30px; font-weight:700;
    line-height:1; color:var(--c)}
  .fc span{font-size:13.5px; color:var(--mute)}
  .prow{background:var(--surface); border:1px solid var(--line); border-radius:4px;
    padding:14px 17px; margin-bottom:9px; box-shadow:var(--shadow)}
  .prow .r1{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:5px}
  .prow .org{font-weight:700; font-size:17.5px; flex:1; min-width:170px}
  .prow .who{font-size:14px; color:var(--ink-2)}
  .prow .nt{font-size:14.5px; color:var(--ink-2); margin-top:4px}
  select{font:inherit; font-size:13.5px; font-weight:600; padding:4px 9px; border-radius:3px;
    border:1px solid var(--line-2); background:var(--surface); color:var(--sv); cursor:pointer}
  select:focus-visible{outline:2px solid var(--brass); outline-offset:1px}
  .ed{border:1px dashed transparent; border-radius:2px; padding:1px 4px; margin:-1px -4px; cursor:text}
  .ed:hover{border-color:var(--line-2)}
  .ed:focus{outline:none; border-color:var(--brass); border-style:solid; background:var(--surface-2)}
  .ed:empty[data-empty]::before{content:attr(data-empty); color:var(--mute)}
  .x{font:inherit; font-size:16px; line-height:1; background:none; border:0; color:var(--mute);
    cursor:pointer; padding:3px 7px; border-radius:3px}
  .x:hover{color:var(--bad); background:var(--surface-2)}
  .btn{font:inherit; font-size:15px; cursor:pointer; padding:11px 16px; border-radius:3px; width:100%;
    border:1px dashed var(--line-2); background:transparent; color:var(--ink-2)}
  .btn:hover{border-color:var(--brass); color:var(--brass); border-style:solid}

  /* ---------- תחתית ---------- */
  .two{display:grid; grid-template-columns:1fr 1fr; gap:22px}
  @media(max-width:820px){.two{grid-template-columns:1fr}}
  textarea{font:inherit; font-size:16.5px; width:100%; min-height:150px; resize:vertical;
    padding:13px 15px; border:1px solid var(--line); border-radius:4px;
    background:var(--surface); color:var(--ink)}
  textarea:focus{outline:none; border-color:var(--brass)}
  .idea{background:var(--surface); border:1px solid var(--line); border-radius:4px;
    padding:12px 15px; margin-bottom:9px; display:flex; gap:9px; align-items:center}
  details.fixed{background:var(--sunk); border:1px solid var(--line); border-radius:4px; padding:13px 17px}
  details.fixed summary{cursor:pointer; font-weight:700; font-size:16px; color:var(--ink-2)}
  details.fixed summary::marker{color:var(--mute)}
  details.fixed .it{padding:12px 0; border-bottom:1px dashed var(--line); font-size:14.5px}
  details.fixed .it:last-child{border-bottom:0}
  details.fixed .it b{display:block; color:var(--ok); font-size:15.5px; margin-bottom:3px}
  details.fixed .it span{color:var(--mute)}

  .bar{position:fixed; inset-inline:0; bottom:0; background:var(--surface);
    border-top:1px solid var(--line-2); padding:13px 20px; display:flex; gap:12px;
    align-items:center; justify-content:center; box-shadow:0 -6px 24px -16px #17171f50; z-index:9}
  .bar[hidden]{display:none!important}
  .bar span{font-size:15px; color:var(--ink-2)}
  .save{font:inherit; font-weight:700; font-size:16px; cursor:pointer; padding:11px 30px;
    border-radius:3px; border:1px solid var(--brass); background:var(--brass); color:#fff}
  .save:disabled{opacity:.55; cursor:default}
  .ghost{font:inherit; font-size:15px; cursor:pointer; padding:10px 18px; border-radius:3px;
    border:1px solid var(--line-2); background:transparent; color:var(--ink-2)}
  .ro{margin-top:14px; font-size:15px; padding:13px 16px; border:1px solid var(--line-2);
    border-radius:4px; background:var(--surface-2); color:var(--ink-2)}
  .foot{margin-top:44px; padding:16px 0 0; border-top:1px solid var(--line);
    font-size:14px; color:var(--mute); display:flex; gap:6px 20px; flex-wrap:wrap}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      <a href="#z-more">רעיונות ופתק</a><a href="#z-fixed">מה תוקן</a>
    </nav>
  </header>

  <section class="zone" id="z-act">
    <div class="zhead"><h2>מה דורש ממך פעולה</h2><span class="sub">רק אתה יכול לעשות את אלה</span></div>

  </section>

  <section class="zone" id="z-fleet">

  </section>

  <section class="zone" id="z-pipe">

    <div class="funnel" id="funnel"></div>
    <div id="pipe"></div>
    <button class="btn" id="addP">+ הוסף ארגון</button>
  </section>

  <section class="zone" id="z-more">
    <div class="two">
      <div>
        <div class="zhead"><h2>רעיונות לסוכנים</h2></div>
        <div id="ideas"></div>
        <button class="btn" id="addI">+ הוסף רעיון</button>
      </div>
      <div>
        <div class="zhead"><h2>פתק לקלוד</h2><span class="sub">נקרא בהרצה הבאה</span></div>
        <textarea id="note" placeholder="מה לשנות, מה הצליח, מה לבנות אחר כך…"></textarea>
      </div>
    </div>
  </section>

  <section class="zone" id="z-fixed">
    <details class="fixed"><summary id="fixsum"></summary><div id="fixlist"></div></details>
  </section>

  <div class="foot" id="foot"></div>
</div>
<div class="bar" id="bar" hidden>
  <span id="barTxt"></span>
  <button class="ghost" id="undo">בטל</button>
  <button class="save" id="save">שמור</button>
</div>
</template>

  var sched = S.agents.filter(function(a){ return a.status==="scheduled" && !a.frozen; }).length;

  document.getElementById("kpis").innerHTML =
    '<div class="kpi"><b>'+S.action.length+'</b><span>ממתין לך</span></div>' +
    '<div class="kpi" style="--k:var(--ok)"><b>'+sched+'</b><span>רצים לבד</span></div>' +

    '<div class="kpi" style="--k:var(--info)"><b>'+open+'</b><span>פניות פתוחות</span></div>';

  document.getElementById("acts").innerHTML = S.action.length ? S.action.map(function(a){
    return '<div class="act"><b>'+esc(a.what)+'</b><p>'+esc(a.why)+'</p>' +

    S.agents.length+" סוכנים · "+nf+" מוקפאים · מקובצים לפי מה שהם מכניסים";

  document.getElementById("tracks").innerHTML = S.tracks.map(function(t){
    var list = S.agents.filter(function(a){ return a.track===t.id; });
    if(!list.length) return "";
    return '<div class="track" style="--tc:'+TC[t.id]+'">' +

      '<span class="cnt">'+list.length+'</span>' +
      '<span class="what">'+esc(t.what)+'</span></div>' +
      '<div class="grid">' + list.map(function(a){
        var si = sInfo(a);
        return '<div class="ag'+(a.frozen?" off":"")+'" data-a="'+esc(a.id)+'" style="--sc:'+si[1]+'">' +

          '<span class="nm ed" contenteditable data-f="name">'+esc(a.name)+'</span>' +
          '<span class="st">'+esc(si[0])+'</span></div>' +
          '<div class="does ed" contenteditable data-f="does">'+esc(a.does)+'</div>' +

function find(list,el,attr){
  var h = el.closest("[data-"+attr+"]"); if(!h) return null;
  var id = h.getAttribute("data-"+attr);
  for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i];
  return null;
}

document.addEventListener("input", function(e){
  var t=e.target;
  if(t===noteEl){ S.note=t.value; touch(); return; }
  if(!t.classList||!t.classList.contains("ed")) return;
  var o = find(S.pipeline,t,"p") || find(S.agents,t,"a") || find(S.ideas,t,"i");
  if(o){ o[t.getAttribute("data-f")] = t.textContent.trim(); touch(); }
});
document.addEventListener("change", function(e){
  if(e.target.tagName!=="SELECT") return;
  var o=find(S.pipeline,e.target,"p"); if(o){ o.status=e.target.value; render(); }
});
document.addEventListener("click", function(e){
  var t=e.target;
  if(t.hasAttribute&&t.hasAttribute("data-frz")){
    var a=find(S.agents,t,"a"); if(a){ a.frozen=!a.frozen; render(); } return; }
  if(t.hasAttribute&&t.hasAttribute("data-del")){
    if(t.getAttribute("data-del")==="p"){ var p=find(S.pipeline,t,"p");
      S.pipeline=S.pipeline.filter(function(x){return x!==p;}); }
    else { var i=find(S.ideas,t,"i"); S.ideas=S.ideas.filter(function(x){return x!==i;}); }
    render(); return; }
  if(t.id==="addP"){ S.pipeline.push({id:uid(),org:"ארגון חדש",who:"",status:"draft",date:"",note:""});
    render(); var c=pipeEl.lastElementChild; if(c) c.querySelector(".ed").focus(); return; }
  if(t.id==="addI"){ S.ideas.push({id:uid(),text:""}); render();
    var d=idEl.lastElementChild; if(d) d.querySelector(".ed").focus(); return; }
  if(t.id==="undo"){ S=JSON.parse(ORIG); render(); return; }
  if(t.id==="save"){ save(); return; }
});

    '<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>לוח הבקרה</title>\n' +
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@300;400;600;700&display=swap">\n' +
    '<style id="css">'+css+'</style>\n</head>\n<body>\n' +
    '<template id="shell">'+shell+'</template>\n<div id="root"></div>\n' +
    '<'+st+' id="state" type="application/json">'+data+'</'+st+'>\n' +
    '<'+st+' id="app">'+app+'</'+st+'>\n</body>\n</html>';
}
function goRO(m){ readOnly=true; bar.hidden=true;
  if(document.getElementById("roNote")) return;
  var d=document.createElement("div"); d.className="ro"; d.id="roNote"; d.textContent=m;
  noteEl.parentNode.appendChild(d); }
function save(){
  if(!api){ goRO("שמירה לא זמינה בתצוגה הזו. השינויים נשארו על המסך בלבד."); return; }
  saveBtn.disabled=true; barTxt.textContent="שומר…";
  api.publish(buildDoc()).then(function(){ barTxt.textContent="נשמר"; })
  ["catch"](function(err){
    var c=err&&err.code;
    if(c==="conflict"){ barTxt.textContent="מישהו שמר לפניך — הדף נטען מחדש"; return; }
    saveBtn.disabled=false;
    if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="capability_disabled")
      goRO("אין לך הרשאת כתיבה לדף הזה, ולכן השינויים לא נשמרו.");
    else if(c==="rate_limited") barTxt.textContent="יותר מדי שמירות — נסה שוב בעוד רגע";
    else if(c==="too_large") barTxt.textContent="הלוח גדול מדי — מחק שורות ישנות";
    else barTxt.textContent="השמירה נכשלה. נסה שוב.";
  });
}

render();
if(window.claude&&window.claude.use){
  window.claude.use("artifact").then(function(a){ api=a;
    if(!a) goRO("שמירה לא זמינה בתצוגה הזו. אפשר לערוך, אבל השינויים לא יישמרו."); })
  ["catch"](function(){ goRO("שמירה לא זמינה בתצוגה הזו."); });
} else goRO("שמירה לא זמינה בתצוגה הזו.");
window.addEventListener("beforeunload", function(e){
  if(dirty&&!readOnly){ e.preventDefault(); e.returnValue=""; } });
})();
</script>
